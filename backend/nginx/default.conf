# Default only when PHP did not set its own (reader pages: "private, no-store" + nosniff), so no header is sent twice.
# An empty value means add_header sends nothing.
map $upstream_http_cache_control $api_cache_control {
    ""      "no-store";
    default "";
}
map $upstream_http_x_content_type_options $api_nosniff {
    ""      "nosniff";
    default "";
}

server {
    listen 80;
    index index.php;
    root /var/www/html/public;
    client_max_body_size 50M;
    server_tokens off;

    # Behind a TLS proxy / load balancer, let only that proxy set the client IP (preferred over the app-level
    # TRUSTED_PROXIES env). Use the proxy's exact address/range; REMOTE_ADDR then is the real client.
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # HSTS: enable only once HTTPS works on this exact host (or set it on the TLS proxy instead), starting short:
    # 300 -> 86400 -> 15552000. No includeSubDomains/preload until every subdomain is on HTTPS. nginx drops
    # server-level add_header in locations that define their own, so repeat it in the two locations below too.
    # add_header Strict-Transport-Security "max-age=300" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Uploaded files are data, never code (regex locations are tried in order: this must precede \.php$).
    location ~* ^/uploads/.*\.(php[0-9]?|phtml|phar)$ {
        return 404;
    }

    # API (every PHP response is JSON from index.php, or a reader page image).
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        add_header X-Content-Type-Options $api_nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control $api_cache_control always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        # add_header Strict-Transport-Security "max-age=300" always;
    }

    # Covers, previews, index files. The reader shows the index PDF in an iframe on the FRONTEND origin, so this
    # path must NOT send X-Frame-Options DENY or frame-ancestors 'none'.
    location /uploads/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # add_header Strict-Transport-Security "max-age=300" always;
    }

    # Full books are served only by the authorised reader API; the PDF and page cache live in
    # backend/storage (outside this root). Belt and braces in case one ever lands under uploads/.
    location ~* ^/uploads/books/[^/]+/(book\.pdf|pages/) {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
