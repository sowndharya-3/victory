server {
    listen 80;
    index index.php;
    root /var/www/html/public;
    client_max_body_size 50M;

    # Behind a TLS proxy / load balancer, let only that proxy set the client IP (preferred over the app-level
    # TRUSTED_PROXIES env). Use the proxy's exact address/range; REMOTE_ADDR then is the real client.
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Full books are served only by the authorised reader API; the PDF and page cache live in
    # backend/storage (outside this root). Belt and braces in case one ever lands under uploads/.
    location ~* ^/uploads/books/[^/]+/(book\.pdf|pages/) {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
